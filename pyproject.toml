[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "titanic-analyzer"
version = "0.1.0"
description = "A Python toolkit for analyzing Titanic passenger data and predicting survival."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Lokesh Pandit" }
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/titanic_analyzer"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]